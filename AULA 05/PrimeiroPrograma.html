<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Programa</title>
</head>
<body>
    <h3>Boas Vindas</h3>
    <Script type="text/javascript">
        // Objetivo: cirar uma página de boas-vindas

        // Definição de variavel
        var js_nome

        // Entrada de dados
        js_nome = window.prompt("Entre com o seu nome:", "Digite aqui:");

        // Saida de dados
        document.write("Olá " + js_nome + " Seja bem vindo");

    </Script>
</body>
</html>
