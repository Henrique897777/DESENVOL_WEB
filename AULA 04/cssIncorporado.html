<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Incorporado</title>
    <style>
        h1{
            color: orange;
            font-size: 30px;
            font-family: times new roman, sans-serif;
            text-decoration: underline;
            font-style: italic;
        }
        p{
            color: purple;
            font-size: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>CEUB</h1>
    <p>Aula de CSS</p>
    <p>Este é um parágrafo com estilo CSS incorporado.</p>
    <h1>Ciência da Computação</h1>
</body>
</html>
