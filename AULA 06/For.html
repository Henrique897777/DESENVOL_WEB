<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura For</title>
</head>
<body>
    <script lang="javascript">
        // Objetivo: aplicação de laço de repitição <for> incremento +2 na variável js_num e apresentando os valores de 1 a 10

        let js_num;
        
        document.write('<p> Apresentação dos valores acumulados para js_num=1 e menor ou igual a 20 incrementndo a variavel de +2:');

        for(js_num=1; js_num<=10; js_num+=2){
            document.write('<p>' + '<b>' +js_num +'</br>');
        }
    </script>
</body>
</html>
