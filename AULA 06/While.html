<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Repetição</title>
</head>
<body>
    <script lang="javascript">
        //     Objetivo: escrever uma mensagem limitando em 10 vezes atravez de um contador que será incrementado de mais 1

        // Definindo variável
        let js_contador =1;

        // aplicação do while
        while(js_contador <=10){
            document.write('<p>' + js_contador+ 'Repetição de uma única linha de comando dentro de um laço de repitição:' );
                js_contador+=1;
                
        }

    </script>
</body>
</html>
