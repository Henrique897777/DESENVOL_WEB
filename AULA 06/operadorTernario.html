<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador ternario</title>
</head>
<body>
    <script lang="javascript">
        // Objetivo: utilizar o operador ternario: fazer um progream em qu eira receber uma variavel com o valor 20 e em seguida verificar condições se verdadeiro ou falso


        //Definir variaveis

        var js_num = 30;

        //APLICAÇÃO DO OPERADOR TERNARIO 
        document.write('<p>jd_num <b> ==</b> 20 <b>?</b>"SIM" <b>:</b> "NÃO" - Resposta => ');
            ((js_num == 20) ? document.write('<b> SIM </b>') : document.write('<b> NÃO </b>'));

        document.write('<p>jd_num <b> !=</b> 20 <b>?</b>"SIM" <b>:</b> "NÃO" - Resposta => ');
            ((js_num != 20) ? document.write('<b> SIM </b>') : document.write('<b> NÃO </b>'));
        

        // faça se js_num for menor que 50, qual será a resposta:
        
        document.write('<p>jd_num <b> < </b> 50 <b>?</b>"SIM" <b>:</b> "NÃO" - Resposta => ');
            ((js_num < 50) ? document.write('<b> SIM </b>') : document.write('<b> NÃO </b>'));


        document.write('<p>jd_num <b> -20  </b> == 0 <b>?</b>"SIM" <b>:</b> "NÃO" - Resposta => ');
            (((js_num -20)  == 0 )? document.write('<b> SIM </b>') : document.write('<b> NÃO </b>'));

    </script>
    
    



</body>
</html>
