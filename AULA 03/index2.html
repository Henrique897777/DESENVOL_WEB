<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário 2</title>
</head>
<body>

    <form action="#" method="POST">

        <fieldset>
            <legend>Identificação do Usuário</legend>
            
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Nom completo"><br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite a senha"><br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail"><br><br>

            <fieldset>
                <legend>Sexo</legend>
                <input type="radio" id="masculino" name="sexo" value="masculino">
                <label for="masculino">Masculino</label><br>
                
                <input type="radio" id="feminino" name="sexo" value="feminino">
                <label for="feminino">Feminino</label>
            </fieldset><br>

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento">
        </fieldset><br>

        <fieldset>
            <legend>Endereço</legend>

            <label for="logradouro">Logradouro:</label>
            <input type="text" id="logradouro" name="logradouro" placeholder="Rua, Av,"><br><br>

            <label for="numero">Número:</label>
            <input type="text" id="numero" name="numero"><br><br>

            <label for="estado">Estado:</label>
            <select id="estado" name="estado">
                <option value="RJ">Rio de Janeiro</option>
                <option value="SP">São Paulo</option>
                <option value="MG">Minas Gerais</option>
                <option value="BA">Bahia</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="DF">Brasília</option>
            </select><br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Sua cidade">
        </fieldset><br>

        <fieldset>
            <legend>Mensagem do Usuário</legend>

            <label for="urgencia">Grau de urgência: Min</label>
            <input type="range" id="urgencia" name="urgencia" min="0" max="100">
            <span>Max</span><br><br>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="4" cols="35"></textarea>
        </fieldset><br>

        <fieldset>
            <legend>Quero um produto:</legend>

            <input type="checkbox" id="produto" name="produto">
            <label for="produto">Gostaria de adquirir um produto quando disponível.</label><br><br>

            <label for="cor">Cor:</label>
            <input type="color" id="cor" name="cor" value=""><br><br>

            <label for="quantidade">Quantidade:</label>
            <input type="text" id="quantidade" name="quantidade"><br><br>

            <label for="preco">Preço Total R$:</label>
            <input type="text" id="preco" name="preco">
        </fieldset><br>

        <input type="submit" value="Enviar">
    </form>
    <br>
    
    <footer>
        GABRIEL HENRIQUE MACHADO PEREIRA
    </footer>

</body>
</html>
