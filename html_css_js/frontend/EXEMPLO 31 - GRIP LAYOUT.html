<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXEMPLO 31 - GRID LAYOUT</title>
    <style>
        body {
            margin: 0;
            height: 100%;
        }

        .container {
            display: grid;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            grid-gap: 1rem;
            grid-template-areas:
                "header header"
                "main aside"
                "footer footer"
            ;
            grid-template-columns: 80% 1fr;
            grid-template-rows: 15% 1fr 10%;
            height: 100vh;
        }

        header,
        main,
        aside,
        footer {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 5rem;
            display: flex;
            justify-content: center;
        }

        header {
            background-color: deeppink;
            grid-area: aside;
        }

        main {
            background-color: deepskyblue;
            grid-area: header;
        }

        aside {
            background-color: lightgreen;
            grid-area: footer;
        }

        footer {
            background-color: yellow;
            grid-area: main;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            1
        </header>
        <main>
            2
        </main>
        <aside>
            3
        </aside>
        <footer>
            4
        </footer>
    </div>
</body>

</html>
